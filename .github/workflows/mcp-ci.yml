name: Scout MCP CI

on:
  push:
    branches: ["main"]
    paths:
      - 'packages/scout-mcp/**'
      - '.github/workflows/mcp-ci.yml'
  pull_request:
    paths:
      - 'packages/scout-mcp/**'
      - '.github/workflows/mcp-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Scout MCP (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18, 20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Scout MCP
        run: npm run typecheck --workspace=packages/scout-mcp

      - name: Build Scout MCP
        run: npm run build --workspace=packages/scout-mcp

      - name: Run Test Suite
        run: npm test --workspace=packages/scout-mcp
